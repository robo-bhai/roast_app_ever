name: Run AppStore Test Servers & Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-appstore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloudflared Official DEB Package
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflare-tunnel-downloads/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gunicorn
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Frontend Dependencies
        run: |
          if [ -f package.json ]; then npm install --legacy-peer-deps; fi

      - name: Run Django Migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Create Superuser (from Secrets if not exists)
        env:
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          import django

          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'appstore_project.settings')
          django.setup()

          from django.contrib.auth import get_user_model
          User = get_user_model()

          username = os.getenv('DJANGO_SUPERUSER_USERNAME', 'admin')
          email = os.getenv('DJANGO_SUPERUSER_EMAIL', 'admin@example.com')
          password = os.getenv('DJANGO_SUPERUSER_PASSWORD', 'admin1234')

          if not User.objects.filter(username=username).exists():
              User.objects.create_superuser(username=username, email=email, password=password)
              print(f"Superuser '{username}' successfully created!")
          else:
              print(f"Superuser '{username}' already exists. Skipping creation.")
          EOF

      - name: Start Gunicorn (Django Backend on Port 8000)
        run: |
          nohup gunicorn appstore_project.wsgi:application --bind 0.0.0.0:8000 > gunicorn.log 2>&1 &
          sleep 3

      - name: Start Vite Frontend Server (Port 3000)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 3000 > vite.log 2>&1 &
          sleep 5

      - name: Start Cloudflare Tunnels via Secrets Tokens
        env:
          BACKEND_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_TOKEN }}
          FRONTEND_TOKEN: ${{ secrets.CLOUDFLARE_FRONTEND_TOKEN }}
        run: |
          if [ -z "$BACKEND_TOKEN" ] || [ -z "$FRONTEND_TOKEN" ]; then
            echo "ERROR: Secrets missing hain! GitHub Secrets verify karein."
            exit 1
          fi

          nohup cloudflared tunnel --no-autoupdate run --token "$BACKEND_TOKEN" > backend_cf.log 2>&1 &
          nohup cloudflared tunnel --no-autoupdate run --token "$FRONTEND_TOKEN" > frontend_cf.log 2>&1 &

          echo "Waiting for Cloudflare Tunnels to establish connections..."
          sleep 10

          echo "=================================================="
          echo "=== Backend Tunnel Log Check ==="
          cat backend_cf.log | head -n 30 || true
          echo "=================================================="
          echo "=== Frontend Tunnel Log Check ==="
          cat frontend_cf.log | head -n 30 || true
          echo "=================================================="

      - name: Monitor and Keep Alive (2 Hours)
        run: |
          echo "Server live hai! Testing start karein."
          
          for i in {1..120}; do
            sleep 60
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "CRITICAL: Cloudflared process stopped! Dumping logs:"
              echo "=== BACKEND LOGS ==="
              cat backend_cf.log || true
              echo "=== FRONTEND LOGS ==="
              cat frontend_cf.log || true
              exit 1
            fi
          done
