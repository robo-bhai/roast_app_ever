name: Run AppStore Test Servers & Cloudflare Tunnel

on:
  workflow_dispatch:

# Jab naya workflow start hoga, pehle wala safely cancel ho kar close ho jaega
concurrency:
  group: appstore-server-group
  cancel-in-progress: true

jobs:
  run-appstore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----------------------------------------------------
      # 1. INSTALL & SETUP RCLONE
      # ----------------------------------------------------
      - name: Install Rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Setup Rclone Config
        env:
          RCLONE_CONFIG_BODY: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BODY" > ~/.config/rclone/rclone.conf

      # ----------------------------------------------------
      # 2. RESTORE DB & APKS FROM DRIVE BEFORE STARTUP
      # ----------------------------------------------------
      - name: Restore DB & APKs from Google Drive
        run: |
          echo "=== Downloading DB & APKs from Drive ==="
          # Remote name 'gdrive:' aur folder paths apne mutabiq adjust kar lein
          rclone copy gdrive:AppStoreBackup/db.sqlite3 ./ --ignore-existing || true
          rclone copy gdrive:AppStoreBackup/apks ./apks/ --ignore-existing || true
          echo "Restore step complete."

      - name: Install Cloudflared
        run: |
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /etc/apt/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install -y cloudflared

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gunicorn whitenoise
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Frontend Dependencies
        run: |
          if [ -f package.json ]; then npm install --legacy-peer-deps; fi

      - name: Run Django Migrations & Collect Static
        run: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py collectstatic --noinput

      - name: Create Superuser
        env:
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          python - << 'EOF'
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'appstore_project.settings')
          django.setup()
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = os.getenv('DJANGO_SUPERUSER_USERNAME', 'admin')
          email = os.getenv('DJANGO_SUPERUSER_EMAIL', 'admin@example.com')
          password = os.getenv('DJANGO_SUPERUSER_PASSWORD', 'admin1234')

          if not User.objects.filter(username=username).exists():
              User.objects.create_superuser(username=username, email=email, password=password)
              print(f"Superuser '{username}' created.")
          EOF

      - name: Start Gunicorn (Backend)
        run: |
          nohup gunicorn appstore_project.wsgi:application --bind 0.0.0.0:8000 > gunicorn.log 2>&1 &
          sleep 3

      - name: Start Vite Frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 3000 > vite.log 2>&1 &
          sleep 5

      - name: Start Cloudflare Tunnels
        env:
          BACKEND_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_TOKEN }}
          FRONTEND_TOKEN: ${{ secrets.CLOUDFLARE_FRONTEND_TOKEN }}
        run: |
          if [ -z "$BACKEND_TOKEN" ] || [ -z "$FRONTEND_TOKEN" ]; then
            echo "ERROR: Secrets missing!"
            exit 1
          fi
          nohup cloudflared tunnel --no-autoupdate run --token "$BACKEND_TOKEN" > backend_cf.log 2>&1 &
          nohup cloudflared tunnel --no-autoupdate run --token "$FRONTEND_TOKEN" > frontend_cf.log 2>&1 &
          sleep 10

      - name: Monitor and Keep Alive (2 Hours)
        timeout-minutes: 120
        run: |
          echo "Server live hai!"
          for i in {1..120}; do
            sleep 60
            if ! pgrep -f "cloudflared" > /dev/null; then
              echo "CRITICAL: Cloudflared process stopped!"
              exit 1
            fi
          done

      # ----------------------------------------------------
      # 3. SAFE BACKUP ON CLOSE / CANCEL / TIMEOUT
      # ----------------------------------------------------
      - name: Safe Push Data to Google Drive on Close
        if: always()
        run: |
          echo "=== Workflow Closing: Syncing data to Google Drive ==="
          
          # SQLite database WAL flush (safely saving state if using WAL mode)
          python - << 'EOF' || true
          import os, django, sqlite3
          if os.path.exists('db.sqlite3'):
              conn = sqlite3.connect('db.sqlite3')
              conn.execute('PRAGMA wal_checkpoint(FULL);')
              conn.close()
          EOF

          # Upload DB and APKs back to Google Drive
          if [ -f "db.sqlite3" ]; then
            rclone copy db.sqlite3 gdrive:AppStoreBackup/
          fi
          
          if [ -d "apks" ]; then
            rclone copy apks gdrive:AppStoreBackup/apks/
          fi
          
          echo "=== Data Successfully Backed Up to Drive ==="
