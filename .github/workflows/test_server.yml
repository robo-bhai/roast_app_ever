name: Run AppStore Test Servers & Cloudflare Tunnel

on:
  workflow_dispatch: # Direct GitHub Actions tab se manual run karne ke liye

jobs:
  run-appstore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloudflared Binary
        run: |
          curl -L -s https://github.com/cloudflare/cloudflare-tunnel-downloads/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gunicorn
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Frontend Dependencies
        run: |
          if [ -f package.json ]; then npm install --legacy-peer-deps; fi

      - name: Run Django Migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Create Superuser (from Secrets if not exists)
        env:
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          import django

          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'appstore_project.settings')
          django.setup()

          from django.contrib.auth import get_user_model
          User = get_user_model()

          username = os.getenv('DJANGO_SUPERUSER_USERNAME', 'admin')
          email = os.getenv('DJANGO_SUPERUSER_EMAIL', 'admin@example.com')
          password = os.getenv('DJANGO_SUPERUSER_PASSWORD', 'admin1234')

          if not User.objects.filter(username=username).exists():
              User.objects.create_superuser(username=username, email=email, password=password)
              print(f"Superuser '{username}' successfully created!")
          else:
              print(f"Superuser '{username}' already exists. Skipping creation.")
          EOF

      - name: Start Gunicorn (Django Backend on Port 8000)
        run: |
          nohup gunicorn appstore_project.wsgi:application --bind 0.0.0.0:8000 > gunicorn.log 2>&1 &
          sleep 3

      - name: Start Vite Frontend Server (Port 3000)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 3000 > vite.log 2>&1 &
          sleep 5

      - name: Start Cloudflare Tunnels & Print Public Links
        run: |
          nohup cloudflared tunnel --url http://localhost:8000 --logfile backend_tunnel.log > /dev/null 2>&1 &
          nohup cloudflared tunnel --url http://localhost:3000 --logfile frontend_tunnel.log > /dev/null 2>&1 &
          
          echo "Waiting for Cloudflare Tunnels to generate public links..."
          
          BACKEND_URL=""
          FRONTEND_URL=""
          
          for i in {1..20}; do
            sleep 2
            if [ -z "$BACKEND_URL" ] && [ -f backend_tunnel.log ]; then
              BACKEND_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' backend_tunnel.log | head -n 1)
            fi
            if [ -z "$FRONTEND_URL" ] && [ -f frontend_tunnel.log ]; then
              FRONTEND_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' frontend_tunnel.log | head -n 1)
            fi
            if [ -n "$BACKEND_URL" ] && [ -n "$FRONTEND_URL" ]; then
              break
            fi
          done

          echo "=================================================="
          echo "  DJANGO BACKEND TUNNEL LINK:"
          echo "${BACKEND_URL:-Backend link generation failed. Checking logs below...}"
          echo "=================================================="
          echo "  REACT FRONTEND TUNNEL LINK:"
          echo "${FRONTEND_URL:-Frontend link generation failed. Checking logs below...}"
          echo "=================================================="

          if [ -z "$BACKEND_URL" ]; then
            echo "--- Backend Cloudflare Log Dump ---"
            cat backend_tunnel.log || true
          fi
          if [ -z "$FRONTEND_URL" ]; then
            echo "--- Frontend Cloudflare Log Dump ---"
            cat frontend_tunnel.log || true
          fi

      - name: Keep Server Alive for 2 Hours (120 Minutes)
        run: |
          echo "Server live hai! Aap uper diye gaye links se 2 ghante tak test kar sakte hain."
          sleep 7200
